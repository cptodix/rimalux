name: Build & Publish APK/AAB to GitHub Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create the GitHub Release as an unpublished draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rimalux-github-release
  cancel-in-progress: false

jobs:
  github-release:
    name: Build Latest Tag & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest semantic version tag
        id: latest_tag
        uses: actions-ecosystem/action-get-latest-tag@v1
        with:
          semver_only: true
          with_initial_version: false

      - name: Checkout latest version tag
        if: ${{ steps.latest_tag.outputs.tag != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.latest_tag.outputs.tag }}

      - name: Resolve release version and filenames
        id: meta
        env:
          LATEST_TAG: ${{ steps.latest_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::No semantic version tag (e.g., v1.0.0) found. Create and push a tag first: git tag v1.0.0 && git push origin v1.0.0"
            exit 1
          fi

          VERSION_NUM="${LATEST_TAG#[vV]}"
          BUILD_DATE=$(date -u +%Y%m%d)
          BASE_FILENAME="rimalux_v${VERSION_NUM}_${BUILD_DATE}"

          {
            echo "tag=${LATEST_TAG}"
            echo "version=${VERSION_NUM}"
            echo "build_date=${BUILD_DATE}"
            echo "base_filename=${BASE_FILENAME}"
            echo "apk_filename=${BASE_FILENAME}.apk"
            echo "aab_filename=${BASE_FILENAME}.aab"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode upload keystore
        id: upload_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'my-upload-key.jks'
          encodedString: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}

      - name: Build and rename signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ steps.upload_keystore.outputs.filePath }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APK_FILENAME: ${{ steps.meta.outputs.apk_filename }}
          AAB_FILENAME: ${{ steps.meta.outputs.aab_filename }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_FILENAME}"
          cp app/build/outputs/bundle/release/app-release.aab "dist/${AAB_FILENAME}"
          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/${BASE_FILENAME}_mapping.txt"
          fi

      - name: Upload APK and AAB to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.base_filename }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and AAB to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Rimalux v${{ steps.meta.outputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ### Release Packages (`${{ steps.meta.outputs.build_date }}`)
            - **Phone Sideload APK:** `${{ steps.meta.outputs.apk_filename }}`
            - **Google Play Console App Bundle (AAB):** `${{ steps.meta.outputs.aab_filename }}`
            - **R8 Deobfuscation Mapping:** `${{ steps.meta.outputs.base_filename }}_mapping.txt`
          files: dist/*
