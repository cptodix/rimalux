name: Build & Publish to Google Play Console

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Console release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: 'Play release status (use draft if app has not passed initial Google Play review)'
        required: true
        default: 'completed'
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
      user_fraction:
        description: 'Staged rollout fraction (0.01 to 0.99 — used only when release_status is inProgress)'
        required: false
        default: ''
        type: string
      in_app_update_priority:
        description: 'In-app update priority (0 = lowest, 5 = highest)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      git_ref:
        description: 'Optional tag (e.g. v1.0.1) or branch; leave empty to build from latest version tag'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: rimalux-google-play-publish
  cancel-in-progress: false

jobs:
  google-play-publish:
    name: Build & Publish AAB to Google Play (${{ inputs.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    steps:
      - name: Checkout repository tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest semantic version tag
        id: latest_tag
        if: ${{ inputs.git_ref == '' }}
        uses: actions-ecosystem/action-get-latest-tag@v1
        with:
          semver_only: true
          with_initial_version: false

      - name: Checkout target release ref
        if: ${{ (inputs.git_ref || steps.latest_tag.outputs.tag) != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || steps.latest_tag.outputs.tag }}

      - name: Resolve release version and bundle filename
        id: meta
        env:
          TARGET_REF: ${{ inputs.git_ref || steps.latest_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_REF" ]; then
            echo "::error::No semantic version tag (e.g., v1.0.1) found. Push a version tag first or specify 'git_ref' manually."
            exit 1
          fi

          GRADLE_VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          GRADLE_VERSION_CODE=$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)

          if printf '%s' "$TARGET_REF" | grep -Eq '^v?[0-9]+\.[0-9]+'; then
            VERSION_NUM="${TARGET_REF#[vV]}"
          else
            VERSION_NUM="$GRADLE_VERSION_NAME"
          fi

          BUILD_DATE=$(date -u +%Y%m%d)
          BASE_FILENAME="rimalux_v${VERSION_NUM}_${BUILD_DATE}"

          WHATSNEW_DIR=""
          if [ -d "distribution/whatsnew" ]; then
            WHATSNEW_DIR="distribution/whatsnew"
          fi

          {
            echo "version=${VERSION_NUM}"
            echo "version_code=${GRADLE_VERSION_CODE}"
            echo "base_filename=${BASE_FILENAME}"
            echo "aab_filename=${BASE_FILENAME}.aab"
            echo "whatsnew_dir=${WHATSNEW_DIR}"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth_wif
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Authenticate to Google Cloud (Service Account JSON)
        id: auth_sa
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode upload keystore
        id: upload_keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: 'my-upload-key.jks'
          encodedString: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}

      - name: Build and rename signed Release AAB
        env:
          KEYSTORE_PATH: ${{ steps.upload_keystore.outputs.filePath }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AAB_FILENAME: ${{ steps.meta.outputs.aab_filename }}
        run: |
          set -euo pipefail
          gradle :app:bundleRelease --no-daemon --stacktrace

          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/${AAB_FILENAME}"

      - name: Archive Release AAB to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.base_filename }}
          path: dist/${{ steps.meta.outputs.aab_filename }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth_wif.outputs.credentials_file_path || steps.auth_sa.outputs.credentials_file_path }}
          packageName: com.cptodix.rimalux.oled.wallpaper
          releaseFiles: dist/${{ steps.meta.outputs.aab_filename }}
          releaseName: v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.version_code }})
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
          userFraction: ${{ inputs.release_status == 'inProgress' && inputs.user_fraction || '' }}
          inAppUpdatePriority: ${{ inputs.in_app_update_priority }}
          whatsNewDirectory: ${{ steps.meta.outputs.whatsnew_dir }}
